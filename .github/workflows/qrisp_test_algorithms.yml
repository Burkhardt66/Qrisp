name: Qrisp unit tests (algorithms & integrations) via Pytest

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: ["3.11.*"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest qiskit-aer qiskit-iqm pyscf stim cirq xdsl
          pip install -e ./
          pip install --upgrade pennylane-catalyst gast
          pip install git+https://github.com/tqec/tqecd.git 
      - name: Test with pytest
        run: |
          pytest tests/algorithms_tests tests/operators_tests tests/block_encodings_tests tests/interface_tests tests/stim_integration_tests
